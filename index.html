<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Button</title>
<style>
  html {
    --red: oklch(0.65 0.3 19.41);
    --particle-curve: cubic-bezier(0.2, 0.56, 0, 1);
  }

  body {
    display: grid;
    place-content: center;
    height: 100vh;
    background: hsl(210deg 15% 6%);
    margin: 0;
  }

  .particleButton {
    position: relative;
    padding: 16px;
    background: transparent;
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }

  .particleButton:hover {
    background: hsl(0deg 0% 100% / 0.1);
  }

  .particleButton:hover path {
    stroke: var(--red);
  }

  .particleButton.liked path {
    fill: var(--red);
    stroke: var(--red);
  }

  .particleButton svg {
    display: block;
    width: 3rem;
    height: 3rem;
  }

  .particle {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
    pointer-events: none;
    animation: fadeToTransparent var(--fade-duration) forwards,
               disperse 500ms forwards var(--particle-curve);
  }

  @keyframes fadeToTransparent {
    to { opacity: 0; }
  }

  @keyframes disperse {
    to {
      transform: translate(
        calc(cos(var(--angle)) * var(--distance)),
        calc(sin(var(--angle)) * var(--distance))
      );
    }
  }

  .visually-hidden:not(:focus):not(:active) {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>

<button class="particleButton">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M3.68546 5.43796C8.61936 1.29159 11.8685 7.4309 12.0406 7.4309C12.2126 7.43091 15.4617 1.29159 20.3956 5.43796C26.8941 10.8991 13.5 21.8215 12.0406 21.8215C10.5811 21.8215 -2.81297 10.8991 3.68546 5.43796Z" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <span class="visually-hidden">Like this post</span>
</button>

<script>
const btn = document.querySelector('.particleButton');
const FADE_DURATION = 1000;

btn.addEventListener('click', () => {
  btn.classList.toggle('liked');
  if (!btn.classList.contains('liked')) return;

  const particles = [];
  range(5).forEach(() => {
    const particle = document.createElement('span');
    particle.classList.add('particle');

    const angle = random(0, 360);
    const distance = random(32, 40);

    particle.style.setProperty('--angle', angle + 'deg');
    particle.style.setProperty('--distance', distance + 'px');
    particle.style.setProperty('--fade-duration', FADE_DURATION + 'ms');

    btn.appendChild(particle);
    particles.push(particle);
  });

  setTimeout(() => particles.forEach(p => p.remove()), FADE_DURATION + 200);
});

function random(lower = 0, upper = 1, floating) {
  if (upper === undefined) { upper = lower; lower = 0; }
  if (floating === true || !Number.isInteger(lower) || !Number.isInteger(upper)) {
    return Math.random() * (upper - lower) + lower;
  }
  return Math.floor(Math.random() * (upper - lower + 1)) + lower;
}

function range(start = 0, end, step) {
  if (end === undefined) { end = start; start = 0; }
  if (step === undefined) { step = start < end ? 1 : -1; }

  const result = [];
  const ascending = step > 0;
  if (ascending) { for (let i = start; i < end; i += step) result.push(i); }
  else { for (let i = start; i > end; i += step) result.push(i); }
  return result;
}
</script>

</body>
</html>
